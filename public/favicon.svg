<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Dark background circle -->
  <circle cx="16" cy="16" r="15" fill="#121418" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- Tick marks -->
  <line x1="16" y1="2.5" x2="16" y2="5"   stroke="rgba(255,255,255,0.35)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="29.5" y1="16" x2="27" y2="16" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="29.5" x2="16" y2="27" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="2.5" y1="16" x2="5" y2="16"   stroke="rgba(255,255,255,0.35)" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Minor ticks -->
  <line x1="24.2" y1="4.3" x2="23.1" y2="6.2"  stroke="rgba(255,255,255,0.15)" stroke-width="1" stroke-linecap="round"/>
  <line x1="27.7" y1="7.8" x2="25.8" y2="8.9"  stroke="rgba(255,255,255,0.15)" stroke-width="1" stroke-linecap="round"/>
  <line x1="27.7" y1="24.2" x2="25.8" y2="23.1" stroke="rgba(255,255,255,0.15)" stroke-width="1" stroke-linecap="round"/>
  <line x1="4.3"  y1="7.8" x2="6.2"  y2="8.9"  stroke="rgba(255,255,255,0.15)" stroke-width="1" stroke-linecap="round"/>
  <line x1="7.8"  y1="4.3" x2="8.9"  y2="6.2"  stroke="rgba(255,255,255,0.15)" stroke-width="1" stroke-linecap="round"/>
  <line x1="4.3"  y1="24.2" x2="6.2" y2="23.1" stroke="rgba(255,255,255,0.15)" stroke-width="1" stroke-linecap="round"/>
  <!-- Second hand (pointing ~5s) -->
  <line x1="16" y1="16" x2="24" y2="8" stroke="#00e87a" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Minute hand (short, at 12) -->
  <line x1="16" y1="16" x2="16" y2="8.5" stroke="rgba(96,165,250,0.8)" stroke-width="2" stroke-linecap="round"/>
  <!-- Centre dot -->
  <circle cx="16" cy="16" r="2" fill="#00e87a"/>
</svg>